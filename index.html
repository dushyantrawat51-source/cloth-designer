<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Cloth Designer</title>

<style>

body{
    background: linear-gradient(
        135deg,
        #ff6b6b,
        #ffd93d,
        #6bcB77,
        #4d96ff
    );

    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;
    min-height: 100vh;
}

.school{
    color: white;
    font-size: 42px;
    font-weight: bold;
    text-shadow: 2px 2px 10px black;
}

.project{
    color: white;
    font-size: 30px;
    margin-top: 10px;
    margin-bottom: 20px;
}

.container{
    background: white;
    max-width: 1100px;
    margin: auto;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 0 20px rgba(0,0,0,0.3);
}

button{

    background: #4d96ff;
    color: white;

    border: none;

    padding: 12px 20px;

    font-size: 18px;

    border-radius: 10px;

    cursor: pointer;
}

button:hover{
    background: #0066ff;
}

.preview{

    width: 350px;
    max-width: 100%;

    border-radius: 15px;

    margin-top: 15px;

    border: 3px solid #ccc;
}
    #mockup{

    position:relative;

    display:inline-block;

}

.designOverlay{

    position:absolute;

    top:8%;

    left:8%;

    width:100%;

    height:100%;

    object-fit:cover;

    opacity:0.6;

    border-radius:10px;

    pointer-events:none;
}

.card{

    display: inline-block;

    width: 280px;

    background: #f8f8f8;

    margin: 15px;

    padding: 15px;

    border-radius: 15px;

    box-shadow: 0 0 10px #ccc;

    vertical-align: top;
}

.card img{

    width: 100%;
    height: 220px;

    object-fit: cover;

    border-radius: 10px;
}

#result{
    margin-top: 20px;
}

</style>

</head>

<body>

<div class="school">

🏫 ALPINE PUBLIC SCHOOL, KHURJA

</div>

<div class="project">

👕 AI CLOTH DESIGNER

</div>

<div class="container">

<p>

Upload or capture a cloth image and get
printing design recommendations.

</p>

<input
type="file"
id="clothImage"
accept="image/*"
capture="environment">

<br><br>

<h2>Cloth Preview</h2>

<div id="mockup">

<img
id="preview"
class="preview">

<img
id="designPreview"
class="designOverlay"
style="display:none;">

</div>

<br><br>

<h2>Selected Design</h2>

<img
id="designPreview"
class="preview"
style="display:none;">

<br><br>

<select id="cloth">

<option value="tshirt">
T-Shirt
</option>

<option value="bedsheet">
Bedsheet
</option>

<option value="handkerchief">
Handkerchief
</option>

</select>

<br><br>

<button onclick="scanCloth()">

Suggest Designs

</button>

<div id="result"></div>

</div>

<script>

document
.getElementById("clothImage")
.onchange = function(event){

    document
    .getElementById("preview")
    .src =
    URL.createObjectURL(
        event.target.files[0]
    );

};

async function scanCloth(){

    const cloth =
    document
    .getElementById("cloth")
    .value;

    const data =
    new FormData();

    data.append(
        "cloth",
        cloth
    );

    try{

        const response =
        await fetch(
            "https://cloth-designer.onrender.com/scan",
            {
                method:"POST",
                body:data
            }
        );

        const result =
        await response.json();

        let html =
        `
        <h2>
        Detected Cloth:
        ${result.cloth}
        </h2>
        `;

        result.designs.forEach(
        design => {

            html +=

            `
            <div class="card">

            <h3>
            ${design.name}
            </h3>

            <img
            src="${design.image}"
            alt="${design.name}">

            <br><br>

            <button
            onclick="applyDesign(
            '${design.image}',
            '${design.name}'
            )">

            Apply Design

            </button>

            </div>
            `;
        });

        document
        .getElementById("result")
        .innerHTML =
        html;

    }

    catch(error){

        console.log(error);

        alert(
        "Could not load designs."
        );

    }
}
function applyDesign(
image,
name
){

    const design =
    document.getElementById(
    "designPreview"
    );

    const cloth =
    document.getElementById(
    "cloth"
    ).value;

    design.style.display =
    "block";

    if(
        cloth === "bedsheet"
    ){

        design.style.top =
        "0%";

        design.style.left =
        "0%";

        design.style.width =
        "100%";

        design.style.height =
        "100%";

    }

    else{

        design.style.top =
        "8%";

        design.style.left =
        "8%";

        design.style.width =
        "84%";

        design.style.height =
        "84%";

    }

    design.src = image;

}
</script>

</body>

</html>
