<!DOCTYPE html>
<html>

<head>

<title>AI Cloth Designer</title>

<style>

body{
font-family:Arial;
background:#f7f7f7;
text-align:center;
}

.card{
width:300px;
background:white;
margin:20px auto;
padding:15px;
border-radius:10px;
box-shadow:0 0 10px #ccc;
}

img{
width:100%;
border-radius:10px;
}

</style>

</head>

<body>

<h1>
👕 AI Cloth Designer
</h1>

<select id="cloth">

<option value="tshirt">
T-Shirt
</option>

<option value="bedsheet">
Bedsheet
</option>

<option value="handkerchief">
Handkerchief
</option>

</select>

<br><br>

<button onclick="scanCloth()">
Suggest Designs
</button>

<div id="result">

</div>

<script>

async function scanCloth(){

const cloth =
document.getElementById(
"cloth"
).value;

const data =
new FormData();

data.append(
"cloth",
cloth
);

const response =
await fetch(
"https://cloth-designer.onrender.com/scan",
{
method:"POST",
body:data
}
);

const result =
await response.json();

let html =

`<h2>
Detected:
${result.cloth}
</h2>`;

result.designs.forEach(
design => {

html +=

`
<div class="card">

<h3>
${design.name}
</h3>

<img src="${design.image}">

</div>
`;

});

document.getElementById(
"result"
).innerHTML =
html;

}

</script>

</body>

</html>
